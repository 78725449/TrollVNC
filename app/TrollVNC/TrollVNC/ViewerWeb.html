<!DOCTYPE html>
<!--
  SuperPhone Viewer 桥接页面（Phase 5.1）
  通过 noVNC rfb.js 以 WebSocket 连接远端 VNC，画面渲染到 #screen 容器；
  与原生侧（TVNCViewerViewController.m）通过以下桥接交互：
    OC → JS：调用 window.connect(url) / disconnect() / sendKey(keysym,down) / pasteText(text)
    JS → OC：通过 webkit.messageHandlers.viewer.postMessage({type, detail}) 上报状态
  noVNC 资源约定位于同级 ./novnc/ 目录（由打包流程复制到 IPA bundle）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 禁用缩放：由 noVNC 内部手势接管双指缩放/滚动 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SuperPhone Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        /* 全屏 RFB 容器：noVNC 将在其内部插入 canvas */
        #screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>

    <script type="module">
        // 引入 noVNC RFB 核心（ES Module）
        // noVNC 资源经打包流程复制到 bundle 的 webclients/ 子目录（见 before-package.sh）
        import RFB from './webclients/novnc/core/rfb.js';

        let rfb = null;          // 当前 RFB 连接实例
        let connecting = false;  // 是否正在建立连接（防止重复 connect）

        /**
         * 向原生侧上报事件。
         * @param {string} type 事件类型：ready/connected/disconnected/failed
         * @param {object} [detail] 附加详情
         */
        function report(type, detail) {
            try {
                window.webkit.messageHandlers.viewer.postMessage({ type: type, detail: detail || {} });
            } catch (e) {
                // 原生桥接未就绪时忽略
            }
        }

        /**
         * 建立到 VNC 服务端的 WebSocket 连接（由 OC 注入调用）。
         * @param {string} url WebSocket 地址，如 ws://host:5801/websockify
         */
        window.connect = function (url) {
            if (connecting) return;
            connecting = true;
            // 若存在旧连接，先断开
            if (rfb) {
                try { rfb.disconnect(); } catch (e) {}
                rfb = null;
            }
            try {
                rfb = new RFB(document.getElementById('screen'), url, {});
                rfb.scaleViewport = true;   // 画面按容器尺寸等比缩放
                rfb.resizeSession = false;  // 不向服务端请求改分辨率
                rfb.showDotCursor = true;   // 显示本地光标点
                rfb.addEventListener('connect', function () {
                    connecting = false;
                    report('connected');
                });
                rfb.addEventListener('disconnect', function (e) {
                    connecting = false;
                    rfb = null;
                    report('disconnected', { clean: e.detail.clean });
                });
                rfb.addEventListener('securityfailure', function (e) {
                    connecting = false;
                    report('failed', { reason: 'security' });
                });
            } catch (err) {
                connecting = false;
                rfb = null;
                report('failed', { reason: String(err) });
            }
        };

        /**
         * 主动断开当前连接（由 OC 注入调用）。
         */
        window.disconnect = function () {
            if (rfb) {
                try { rfb.disconnect(); } catch (e) {}
                rfb = null;
            }
            connecting = false;
        };

        /**
         * 发送一个按键事件（由 OC 注入调用）。
         * @param {number} keysym X11 keysym 值
         * @param {boolean} down true=按下，false=释放；省略则按下后立即释放
         */
        window.sendKey = function (keysym, down) {
            if (!rfb) return;
            try { rfb.sendKey(keysym, null, down); } catch (e) {}
        };

        /**
         * 向远端写入/粘贴文本（由 OC 注入调用，用于剪贴板与文本输入）。
         * @param {string} text 待发送文本
         */
        window.pasteText = function (text) {
            if (!rfb) return;
            try { rfb.clipboardPasteFrom(text); } catch (e) {}
        };

        // 页面与 noVNC 模块加载完成，通知原生侧可下发连接参数
        report('ready');
    </script>
</head>

<body>
    <div id="screen">
        <!-- 远端画面 canvas 将由 noVNC 注入到此容器 -->
    </div>
</body>
</html>
